# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to PyPI in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/lithic-com/lithic-python/actions/workflows/publish-pypi.yml
name: Publish PyPI
on:
  workflow_dispatch:

  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rye
        run: |
          curl -sSf https://rye.astral.sh/get | bash
          echo "$HOME/.rye/shims" >> $GITHUB_PATH
        env:
          RYE_VERSION: '0.44.0'
          RYE_INSTALL_OPTION: '--yes'

      # bin/publish-pypi's tokenless `rye publish` cannot do the trusted-publishing OIDC exchange
      # ("an access token is required"), so build with rye and upload with the uv that rye
      # bundles, which supports trusted publishing natively. Globbed rather than pinned so a rye
      # bump that changes its bundled uv version doesn't silently break this.
      - name: Publish to PyPI
        run: |
          set -euo pipefail
          rye build --clean
          uvs=("$HOME"/.rye/uv/*/uv)
          if [ "${#uvs[@]}" -ne 1 ] || [ ! -x "${uvs[0]}" ]; then
            echo "::error::Expected exactly one rye-bundled uv, found: ${uvs[*]}"
            exit 1
          fi
          "${uvs[0]}" publish --trusted-publishing always
